name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build and test packages
        run: |
          set -e
          for pkg in Packages/*/; do
            echo "::group::$pkg"
            (cd "$pkg" && swift build --build-tests && swift test)
            echo "::endgroup::"
          done

  librclone-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build universal librclone
        run: scripts/build-librclone.sh shared
      - name: Check architectures
        run: lipo -info build/librclone/librclone.dylib
      - name: RcloneKit tests with the real library
        working-directory: Packages/RcloneKit
        run: DOCKYARD_LIBRCLONE="$GITHUB_WORKSPACE/build/librclone/librclone.dylib" swift test

  app-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: App
        run: xcodegen
      - name: Build app
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild -scheme Dockyard -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 300
      - name: Compiler diagnostics
        if: failure()
        run: grep -E "error:|warning:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -100
