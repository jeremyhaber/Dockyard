name: Dockyard
options:
  bundleIdPrefix: app.dockyard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  DockyardCore:
    path: ../Packages/DockyardCore
  ConnectionKit:
    path: ../Packages/ConnectionKit
  RcloneKit:
    path: ../Packages/RcloneKit
targets:
  Dockyard:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - Dockyard.entitlements
    dependencies:
      - package: DockyardCore
        product: DockyardCore
      - package: ConnectionKit
        product: ConnectionKit
      - package: RcloneKit
        product: RcloneKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Dockyard
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright Dockyard"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dockyard.mac
        PRODUCT_NAME: Dockyard
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Dockyard.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    postCompileScripts:
      - name: Embed librclone if present
        basedOnDependencyAnalysis: false
        script: |
          # librclone is built by scripts/build-librclone.sh into build/librclone. Optional: without it the
          # app runs and cloud protocols report that the rclone library is not bundled.
          SRC="${SRCROOT}/../build/librclone/librclone.dylib"
          DEST="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          if [ -f "$SRC" ]; then
            mkdir -p "$DEST"
            cp -f "$SRC" "$DEST/librclone.dylib"
            IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-}"
            if [ -n "$IDENTITY" ] && [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
              codesign --force --sign "$IDENTITY" "$DEST/librclone.dylib" || true
            fi
            echo "Embedded librclone.dylib"
          else
            echo "note: librclone.dylib not found at $SRC, skipping (run scripts/build-librclone.sh to bundle it)"
          fi
schemes:
  Dockyard:
    build:
      targets:
        Dockyard: all
    run:
      config: Debug
    test:
      config: Debug
